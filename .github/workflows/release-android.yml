name: 发布 Android 版

on:
  workflow_dispatch:
    inputs:
      version:
        description: '正式版本号，例如 0.1.5（不带 v）'
        type: string
        required: true
      notes:
        description: '可选：更新说明，留空由 GitHub 生成'
        type: string
      build_only:
        description: '仅构建验证，APK 存为 Actions Artifact'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-android

jobs:
  build:
    name: 校验、测试与打包
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 校验版本号
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          pattern='^(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$'
          version_code() {
            [[ $1 =~ $pattern ]] || return 1
            local code=$((BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3]))
            (( code >= 3 && code < 2100000000 )) || return 1
            printf '%s\n' "$code"
          }
          code=$(version_code "$RELEASE_VERSION") || {
            echo '::error::请输入有效且高于现有客户端的版本号，例如 0.1.5。'
            exit 1
          }
          while IFS= read -r tag; do
            if previous=$(version_code "${tag#android-v}") && (( previous >= code )); then
              echo "::error::版本号必须高于已存在的 Android 标签 $tag"
              exit 1
            fi
          done < <(git tag --list 'android-v*')
          printf 'ORG_GRADLE_PROJECT_workshopVersionCode=%s\nORG_GRADLE_PROJECT_workshopVersionName=%s\n' "$code" "$RELEASE_VERSION" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: 准备 APK 签名
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_PROPERTIES: ${{ secrets.ANDROID_SIGNING_PROPERTIES }}
          BUILD_ONLY: ${{ inputs.build_only }}
        shell: bash
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_SIGNING_PROPERTIES" ]]; then
            umask 077
            mkdir -p .android-signing
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > .android-signing/release.keystore
            printf '%s\n' "$ANDROID_SIGNING_PROPERTIES" > .android-signing/signing.properties
            echo 'VERIFY_EXISTING_SIGNER=true' >> "$GITHUB_ENV"
          elif [[ "$BUILD_ONLY" != true || -n "$ANDROID_KEYSTORE_BASE64" || -n "$ANDROID_SIGNING_PROPERTIES" ]]; then
            echo '::error::请先配置 Android 正式版的两个签名 Secrets。'
            exit 1
          else
            echo '::notice::此次仅构建验证将生成临时签名，适合空白模拟器。'
          fi
      - name: 构建并校验签名 APK
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          npm pkg set "version=$RELEASE_VERSION"
          pnpm package:android
          apk="release/Sylunae-Workshop-$RELEASE_VERSION-Android.apk"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          signature=$("$tools/apksigner" verify --print-certs "$apk")
          if [[ "${VERIFY_EXISTING_SIGNER:-false}" == true ]] && ! grep -Fxq 'Signer #1 certificate SHA-256 digest: d123275fa25113885ec020ef16759b22276d2bfe90a7be5688f86bca5c4a7fa4' <<< "$signature"; then
            echo '::error::APK 签名与现有 Android 正式版不匹配。'
            exit 1
          fi
          badging=$("$tools/aapt" dump badging "$apk")
          grep -Fq "package: name='studio.sylunae.workshop' versionCode='$ORG_GRADLE_PROJECT_workshopVersionCode' versionName='$RELEASE_VERSION'" <<< "$badging"
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ inputs.version }}
          if-no-files-found: error
          path: release/Sylunae-Workshop-${{ inputs.version }}-Android.apk

  publish:
    name: 发布 Android GitHub Release
    if: ${{ !inputs.build_only }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-${{ inputs.version }}
          path: release
      - name: 上传 APK 后发布
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.notes }}
        shell: bash
        run: |
          tag="android-v$RELEASE_VERSION"
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" --silent; then
            echo "::error::标签 $tag 已存在"
            exit 1
          fi
          notes=(--generate-notes)
          if [[ -n "$RELEASE_NOTES" ]]; then
            printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/android-release-notes.md"
            notes=(--notes-file "$RUNNER_TEMP/android-release-notes.md")
          fi
          gh release create "$tag" --draft --target "$GITHUB_SHA" \
            --title "丝月工坊 Android v$RELEASE_VERSION" "${notes[@]}" \
            "release/Sylunae-Workshop-$RELEASE_VERSION-Android.apk"
          gh release edit "$tag" --draft=false --latest=false
